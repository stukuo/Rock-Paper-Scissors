<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h2>Player</h2>
                <h2>Vs</h2>
                <h2>Robot</h2>
            </div>
            <div class="header">
                <h3 id="player-score">score : 0</h3>
                <h3>|</h3>
                <h3 id="robot-score">score : 0</h3>
            </div>
            <div class="display">
                <div id="player-display">ROCK</div>
            
                <div id="robot-display">PAPER</div>
            </div>
            <div class="options">
                <button id="rock">Rock</button>
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>
        </div>

        <div id="result" class="card">
            <div class="header">
                <h2>*</h2>
                <h3>[ OVERAL GAME ]</h3>
                <h2>*</h2>
            </div>

            <div class="header">
                <h1 id="overal">Robot Win!</h1>
            </div>

            <div class="options">
                <button id="play">Play Again?</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
